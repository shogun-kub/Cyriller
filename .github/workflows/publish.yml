name: publish

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  publish:
    # Windows обязателен: Cyriller.Checker — WinForms (net10.0-windows), на Linux он не
    # собирается; Desktop на Avalonia тоже удобнее проверять на той же платформе.
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Cyriller.sln -c Release

      - name: Test
        run: dotnet test Cyriller.Tests/Cyriller.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack Cyriller/Cyriller.csproj -c Release -o out/packages

      - name: NuGet login (OIDC -> temporary key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        shell: pwsh
        run: |
          $packages = Get-ChildItem out/packages/*.nupkg
          if (-not $packages) { throw 'No .nupkg in out/packages' }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Push failed for $($package.Name)" }
          }
